spring:
    cloud:
        config:
            discovery:
                enabled: 'true'
                serviceId: config-service
        gateway:
            routes:
              - id: checkout-service
                uri: http://localhost:8082
                predicates:
                  - Path=/checkout
    config:
        import: 'optional:configserver:'
    application:
        name: gateway-service
server:
    port: 8084
